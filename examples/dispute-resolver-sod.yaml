version: 2
agent: dispute-resolver
identity: spiffe://bank/agents/dispute-resolver
limits:
  quantities:
    value:
      amount: 500
      unit: GBP
roles:
  proposer:
  - issue_refund
  approver:
  - approve_refund
tools:
- name: open_case
  effect: read
  produces: case
- name: issue_refund
  effect: irreversible
  requires:
  - case
  value_arg: amount
  scope_key: case
  ceiling:
    amount: 500
    unit: GBP
  requires_approval: true
  quantity: value
- name: approve_refund
  effect: write
  requires:
  - case
- name: close_ledger_entry
  effect: irreversible
  principal: service
  requires:
  - case
