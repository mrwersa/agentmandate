version: 2
agent: dispute-resolver
identity: spiffe://bank/agents/dispute-resolver
limits:
  depth: 8
  quantities:
    value:
      amount: 500
      unit: GBP
tools:
- name: open_case
  effect: read
  principal: caller
  produces: case
- name: search_cases
  effect: read
  principal: caller
  produces: case
  unbounded: true
- name: fetch_case
  effect: read
  principal: caller
  requires:
  - case
- name: issue_refund
  effect: irreversible
  principal: caller
  requires:
  - case
  value_arg: amount
  scope_key: case
  ceiling:
    amount: 500
    unit: GBP
  requires_approval: true
  quantity: value
