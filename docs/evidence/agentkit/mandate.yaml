# Real tool graph: Coinbase AgentKit, Strands example chatbot
# (python/examples/strands-agents-cdp-server-chatbot), providers wired in:
# cdp_api, erc20, pyth, wallet, weth, wow, compound.
#
# The controls below are encoded, not shipped: AgentKit itself has no
# cumulative ceilings, only wallet balance and CDP API keys. The per-binding
# ceilings and the session total are the controls a team running this agent
# would actually need, expressed in the only place they can be.
#
# Anchoring note (the distortion): real transfer/native_transfer/buy/sell take
# the asset as a free argument, and NO tool produces an 'asset' scope. The
# manifest model attaches a ceiling only to a scope a prior tool produced, so
# each value tool is scoped to the binding it actually spends: WETH the agent
# wrapped, ETH the agent unwrapped or fauchted, the WOW token it created, the
# asset it borrowed. The fact that this anchoring must be invented is a real
# model limitation, recorded at the end.
version: 1
agent: cdp-wallet-agent
identity: spiffe://coinbase/agents/cdp-wallet-agent

limits:
  total: { amount: 700, currency: USD }
  depth: 8

tools:
  # wallet_action_provider
  - name: get_wallet_details
    effect: read
    principal: caller

  - name: get_balance
    effect: read
    principal: caller

  - name: native_transfer
    effect: irreversible
    principal: caller
    requires: [eth]
    value_arg: amount
    scope_key: eth
    ceiling: { amount: 500, currency: USD }
    requires_approval: true

  # erc20_action_provider
  - name: transfer
    effect: irreversible
    principal: caller
    requires: [weth]
    value_arg: amount
    scope_key: weth
    ceiling: { amount: 500, currency: USD }
    requires_approval: true

  - name: approve
    effect: write
    principal: caller
    produces: allowance

  - name: get_allowance
    effect: read
    principal: caller
    requires: [allowance]

  - name: get_erc20_token_address
    effect: read
    principal: caller

  # pyth_action_provider (read-only price oracle)
  - name: fetch_price_feed
    effect: read
    principal: caller

  - name: fetch_price
    effect: read
    principal: caller

  # cdp_api_action_provider
  - name: request_faucet_funds
    effect: write
    principal: caller
    produces: eth
    unbounded: true

  # weth_action_provider
  - name: wrap_eth
    effect: write
    principal: caller
    produces: weth
    unbounded: true

  - name: unwrap_eth
    effect: write
    principal: caller
    requires: [weth]
    produces: eth

  # wow_action_provider
  - name: buy_token
    effect: irreversible
    principal: caller
    requires: [token]
    value_arg: amount
    scope_key: token
    ceiling: { amount: 500, currency: USD }
    requires_approval: true

  - name: create_token
    effect: irreversible
    principal: caller
    produces: token
    requires_approval: true

  - name: sell_token
    effect: irreversible
    principal: caller
    requires: [token]
    value_arg: amount
    scope_key: token
    ceiling: { amount: 500, currency: USD }
    requires_approval: true

  # compound_action_provider
  - name: supply
    effect: write
    principal: caller
    produces: supplied

  - name: withdraw
    effect: write
    principal: caller
    requires: [supplied]

  - name: borrow
    effect: write
    principal: caller
    produces: borrowed_asset
    unbounded: true

  - name: repay
    effect: irreversible
    principal: caller
    requires: [borrowed_asset]
    value_arg: amount
    scope_key: borrowed_asset
    ceiling: { amount: 500, currency: USD }
    requires_approval: true

  - name: get_portfolio
    effect: read
    principal: caller

  # x402_action_provider (added coinbase-agentkit@v0.7.4)
  - name: make_http_request
    effect: read
    principal: caller

  - name: make_http_request_with_x402
    effect: irreversible
    principal: caller
    requires_approval: true

  - name: retry_http_request_with_x402
    effect: irreversible
    principal: caller
    requires_approval: true

  # onramp_action_provider (added coinbase-agentkit@v0.7.4)
  - name: get_onramp_buy_url
    effect: write
    principal: caller

  # ssh_action_provider (added coinbase-agentkit@v0.7.4)
  - name: remote_shell
    effect: irreversible
    principal: caller
    requires_approval: true

# Recorded at the end, as the header promises.
#
# Three distortions remain, each a finding about the model rather than a bug
# in this file:
#
# 1. Under-expression. Real transfer/native_transfer/buy/sell take the asset
#    as a free argument and no tool produces an 'asset' scope, so a ceiling
#    has nothing to attach to. The weth/eth/token/borrowed_asset anchors
#    above are invented producers. Drop them and the value tools stop being
#    visible to the cumulative total at all.
# 2. Over-expression (the more serious half). borrow and wrap_eth are marked
#    unbounded because the model cannot express a bounded producer: Compound
#    borrow is bounded by the collateral ratio and wrap_eth is 1:1 with the
#    ETH balance. Marking them unbounded makes reach report paths nobody can
#    take. For a gate the expensive failure is a false positive, because a
#    gate that cries wolf gets switched off.
# 3. Gross rather than net. buy_token then sell_token of the same binding
#    nets to roughly zero but counts 1000 USD against the total. The model
#    has no way to declare which the reader is seeing, exposure or turnover.
#    Gross is defensible, but it should be declarable.
