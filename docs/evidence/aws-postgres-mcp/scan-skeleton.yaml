# Generated by `mandate scan`. This is a starting point, not a manifest.
#
# Every REVIEW line is a judgement the tool catalogue could not supply.
# Effects were guessed from the tool name and default to irreversible,
# because under-calling an effect is the more expensive mistake.
#
# Delete each REVIEW comment once you have confirmed the line under it.

version: 1
agent: "aws-postgres-agent"

# REVIEW: set the workload identity this agent runs as.
# identity: spiffe://example/agents/aws-postgres-agent

limits:
  # REVIEW: the most one run may spend. Without this, `reach` has no
  # cumulative limit to search for a way to exceed.
  # total: { amount: 0, currency: GBP }
  depth: 8

tools:
  # Run a SQL query against PostgreSQL
  - name: "run_query"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller

  # Fetch table columns and comments from Postgres
  - name: "get_table_schema"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller

  # Connect to a specific database and save the connection internally
  - name: "connect_to_database"
    # REVIEW: effect guessed from the name. read | write | irreversible
    effect: irreversible
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires_approval: true

  # Check if a connection has been established
  - name: "is_database_connected"
    # REVIEW: effect guessed from the name. read | write | irreversible
    effect: irreversible
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires_approval: true

  # Get all cached database connection information
  - name: "get_database_connection_info"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller

  # Create an Aurora Postgres cluster
  - name: "create_cluster"
    # REVIEW: effect guessed from the name. read | write | irreversible
    effect: write
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller

  # get background job status
  - name: "get_job_status"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires: ["job"]

# REVIEW: no tool was detected as producing a scope, so every
