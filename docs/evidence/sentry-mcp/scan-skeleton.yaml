# Generated by `mandate scan`. This is a starting point, not a manifest.
#
# Every REVIEW line is a judgement the tool catalogue could not supply.
# Effects were guessed from the tool name and default to irreversible,
# because under-calling an effect is the more expensive mistake.
#
# Delete each REVIEW comment once you have confirmed the line under it.

version: 1
agent: "sentry-operations-agent"

# REVIEW: set the workload identity this agent runs as.
# identity: spiffe://example/agents/sentry-operations-agent

limits:
  # REVIEW: the most one run may spend. Without this, `reach` has no
  # cumulative limit to search for a way to exceed.
  # total: { amount: 0, currency: GBP }
  depth: 8

tools:
  # Find organizations that the user has access to in Sentry. Use this tool when you need to: - View
  - name: "find_organizations"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller

  # Find projects in Sentry. Use this tool when you need to: - View projects in a Sentry organizatio
  - name: "find_projects"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller

  # Update a Sentry issue's status or assignment. Use this to resolve, reopen, assign, or ignore an
  - name: "update_issue"
    # REVIEW: effect guessed from the name. read | write | irreversible
    effect: write
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires: ["issue"]

  # Search Sentry events and replays. Use for event counts/statistics. `query` can be natural langua
  - name: "search_events"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    # REVIEW: limit looks like a value argument. A ceiling needs scope_key too.
    # value_arg: "limit"
    # scope_key: "REVIEW"
    # ceiling: { amount: 0, currency: GBP }

  # Search for grouped issues/problems in Sentry - returns a LIST of issues, NOT counts or aggregati
  - name: "search_issues"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires: ["projectslugor"]
    # REVIEW: limit looks like a value argument. A ceiling needs scope_key too.
    # value_arg: "limit"
    # scope_key: "projectslugor"
    # ceiling: { amount: 0, currency: GBP }

  # Fetch a Sentry resource by URL, or by resourceType plus resourceId. Pass a Sentry URL directly w
  - name: "get_sentry_resource"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires: ["resource"]

  # Search the available Sentry MCP tool catalog by name and description. Many Sentry operations are
  - name: "search_sentry_tools"
    effect: read
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    # REVIEW: limit looks like a value argument. A ceiling needs scope_key too.
    # value_arg: "limit"
    # scope_key: "REVIEW"
    # ceiling: { amount: 0, currency: GBP }

  # Execute an available Sentry MCP tool discovered through search_sentry_tools. Use this tool when
  - name: "execute_sentry_tool"
    # REVIEW: effect guessed from the name. read | write | irreversible
    effect: irreversible
    # REVIEW: does this spend the caller's authority or a service account?
    principal: caller
    requires_approval: true

