<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A read-only tool widens a payment-dispute agent's effective authority</title>
  <desc id="desc">Version one can issue one approved refund of up to 500 pounds. Version two adds a read-only case search that supplies more case scopes, making two individually valid refunds reachable and breaching the 500 pound run limit. AgentMandate reports the full counterexample path in CI.</desc>
  <rect width="1200" height="620" fill="#f7f8fa"/>

  <text x="60" y="58" fill="#17202a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">A read-only tool can widen spending authority</text>
  <text x="60" y="91" fill="#53606d" font-family="Inter, Arial, sans-serif" font-size="17">Payment-dispute agent · £500 per case · £500 per run · human approval required</text>

  <rect x="60" y="130" width="500" height="350" rx="8" fill="#ffffff" stroke="#b8c2cc" stroke-width="2"/>
  <text x="88" y="170" fill="#17202a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Release 1 · bounded</text>
  <text x="88" y="198" fill="#53606d" font-family="Inter, Arial, sans-serif" font-size="16">One case binding, one approved refund path</text>

  <rect x="90" y="240" width="120" height="58" rx="6" fill="#e8f1fb" stroke="#3978b8" stroke-width="2"/>
  <text x="150" y="276" text-anchor="middle" fill="#174a7a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">open_case</text>
  <line x1="210" y1="269" x2="278" y2="269" stroke="#607080" stroke-width="3"/>
  <polygon points="278,269 266,262 266,276" fill="#607080"/>
  <text x="244" y="253" text-anchor="middle" fill="#53606d" font-family="Inter, Arial, sans-serif" font-size="13">case #1</text>
  <rect x="280" y="230" width="224" height="78" rx="6" fill="#e9f6ef" stroke="#278657" stroke-width="2"/>
  <text x="392" y="262" text-anchor="middle" fill="#17633f" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">issue_refund</text>
  <text x="392" y="286" text-anchor="middle" fill="#37604d" font-family="Inter, Arial, sans-serif" font-size="14">approved · £500</text>

  <rect x="90" y="350" width="414" height="78" rx="6" fill="#f1f4f7"/>
  <text x="112" y="382" fill="#30404f" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Reachable total</text>
  <text x="480" y="382" text-anchor="end" fill="#17633f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">£500</text>
  <text x="112" y="408" fill="#53606d" font-family="Inter, Arial, sans-serif" font-size="14">Within the £500 run limit</text>

  <rect x="600" y="130" width="540" height="350" rx="8" fill="#ffffff" stroke="#dc6b3c" stroke-width="3"/>
  <text x="628" y="170" fill="#17202a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Release 2 · widened</text>
  <text x="628" y="198" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="16">A read-only search supplies fresh case bindings</text>

  <rect x="630" y="214" width="130" height="58" rx="6" fill="#e8f1fb" stroke="#3978b8" stroke-width="2"/>
  <text x="695" y="249" text-anchor="middle" fill="#174a7a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">open_case</text>
  <rect x="630" y="305" width="130" height="58" rx="6" fill="#fff0e8" stroke="#dc6b3c" stroke-width="2"/>
  <text x="695" y="330" text-anchor="middle" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">search_cases</text>
  <text x="695" y="350" text-anchor="middle" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="12">read only</text>

  <line x1="760" y1="243" x2="816" y2="243" stroke="#607080" stroke-width="3"/>
  <polygon points="816,243 804,236 804,250" fill="#607080"/>
  <line x1="760" y1="334" x2="816" y2="334" stroke="#607080" stroke-width="3"/>
  <polygon points="816,334 804,327 804,341" fill="#607080"/>
  <text x="788" y="228" text-anchor="middle" fill="#53606d" font-family="Inter, Arial, sans-serif" font-size="12">case #1</text>
  <text x="788" y="319" text-anchor="middle" fill="#53606d" font-family="Inter, Arial, sans-serif" font-size="12">case #2</text>

  <rect x="820" y="210" width="260" height="66" rx="6" fill="#fff0e8" stroke="#dc6b3c" stroke-width="2"/>
  <text x="950" y="237" text-anchor="middle" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">issue_refund</text>
  <text x="950" y="259" text-anchor="middle" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="13">approved · £500</text>
  <rect x="820" y="305" width="260" height="66" rx="6" fill="#fff0e8" stroke="#dc6b3c" stroke-width="2"/>
  <text x="950" y="332" text-anchor="middle" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">issue_refund</text>
  <text x="950" y="354" text-anchor="middle" fill="#8b3d20" font-family="Inter, Arial, sans-serif" font-size="13">approved · £500</text>

  <rect x="630" y="395" width="450" height="55" rx="6" fill="#fdecea"/>
  <text x="652" y="429" fill="#842f23" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Reachable total £1,000 &gt; £500 run limit</text>

  <line x1="600" y1="520" x2="1140" y2="520" stroke="#b8c2cc" stroke-width="2"/>
  <rect x="60" y="505" width="480" height="76" rx="8" fill="#17202a"/>
  <text x="84" y="536" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">AgentMandate in CI</text>
  <text x="84" y="561" fill="#d8e0e7" font-family="Inter, Arial, sans-serif" font-size="14">Finds the legal sequence and blocks the widening release for review</text>
  <line x1="540" y1="543" x2="585" y2="543" stroke="#17202a" stroke-width="3"/>
  <polygon points="585,543 573,536 573,550" fill="#17202a"/>
  <rect x="600" y="505" width="540" height="76" rx="8" fill="#fdecea" stroke="#c84b3a" stroke-width="2"/>
  <text x="624" y="536" fill="#842f23" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">verdict: WIDENING</text>
  <text x="624" y="561" fill="#842f23" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">search_cases → refund(case #1) → refund(case #2)</text>
</svg>
