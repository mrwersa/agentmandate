version: 2
agent: cdp-wallet-agent
identity: spiffe://coinbase/agents/cdp-wallet-agent
limits:
  depth: 8
  quantities:
    value:
      amount: 700
      unit: USD
tools:
- name: request_faucet_funds
  effect: write
  principal: caller
  produces: eth
  unbounded: true
- name: get_balance
  effect: read
  principal: caller
- name: transfer
  effect: irreversible
  principal: caller
  requires:
  - weth
  value_arg: amount
  scope_key: weth
  ceiling:
    amount: 500
    unit: USD
  requires_approval: true
  quantity: value
- name: approve
  effect: write
  principal: caller
  produces: allowance
- name: get_allowance
  effect: read
  principal: caller
  requires:
  - allowance
- name: get_erc20_token_address
  effect: read
  principal: caller
- name: fetch_price
  effect: read
  principal: caller
- name: fetch_price_feed
  effect: read
  principal: caller
- name: get_wallet_details
  effect: read
  principal: caller
- name: native_transfer
  effect: irreversible
  principal: caller
  requires:
  - eth
  value_arg: amount
  scope_key: eth
  ceiling:
    amount: 500
    unit: USD
  requires_approval: true
  quantity: value
- name: wrap_eth
  effect: write
  principal: caller
  produces: weth
  unbounded: true
- name: unwrap_eth
  effect: write
  principal: caller
  requires:
  - weth
  produces: eth
- name: buy_token
  effect: irreversible
  principal: caller
  requires:
  - token
  value_arg: amount
  scope_key: token
  ceiling:
    amount: 500
    unit: USD
  requires_approval: true
  quantity: value
- name: create_token
  effect: irreversible
  principal: caller
  produces: token
  requires_approval: true
- name: sell_token
  effect: irreversible
  principal: caller
  requires:
  - token
  value_arg: amount
  scope_key: token
  ceiling:
    amount: 500
    unit: USD
  requires_approval: true
  quantity: value
- name: supply
  effect: write
  principal: caller
  produces: supplied
- name: withdraw
  effect: write
  principal: caller
  requires:
  - supplied
- name: borrow
  effect: write
  principal: caller
  produces: borrowed_asset
  unbounded: true
- name: repay
  effect: irreversible
  principal: caller
  requires:
  - borrowed_asset
  value_arg: amount
  scope_key: borrowed_asset
  ceiling:
    amount: 500
    unit: USD
  requires_approval: true
  quantity: value
- name: get_portfolio
  effect: read
  principal: caller
