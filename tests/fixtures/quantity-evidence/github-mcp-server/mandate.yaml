version: 2
agent: gh-mcp-agent
identity: spiffe://example/agents/gh-mcp-agent
limits:
  depth: 8
tools:
- name: actions_get
  effect: read
  principal: caller
- name: actions_list
  effect: read
  principal: caller
- name: actions_run_trigger
  effect: irreversible
  principal: caller
  requires:
  - workflow
  requires_approval: true
- name: create_branch
  effect: write
  principal: caller
- name: create_or_update_file
  effect: write
  principal: caller
  produces: workflow
  unbounded: true
- name: create_repository
  effect: write
  principal: caller
- name: delete_file
  effect: irreversible
  principal: caller
  requires_approval: true
- name: fork_repository
  effect: write
  principal: caller
- name: get_commit
  effect: read
  principal: caller
- name: get_file_contents
  effect: read
  principal: caller
- name: get_job_logs
  effect: read
  principal: caller
- name: get_latest_release
  effect: read
  principal: caller
- name: get_release_by_tag
  effect: read
  principal: caller
- name: get_tag
  effect: read
  principal: caller
- name: list_branches
  effect: read
  principal: caller
- name: list_commits
  effect: read
  principal: caller
- name: list_releases
  effect: read
  principal: caller
- name: list_repository_collaborators
  effect: read
  principal: caller
- name: list_tags
  effect: read
  principal: caller
- name: push_files
  effect: write
  principal: caller
  produces: workflow
  unbounded: true
- name: search_code
  effect: read
  principal: caller
- name: search_commits
  effect: read
  principal: caller
- name: search_repositories
  effect: read
  principal: caller
