name: Action

# The action runs against this repository's own examples. A wrapper nobody
# exercises is a wrapper that breaks quietly, and the failure would land in
# somebody else's pull request rather than here.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repairs:
    name: Repair suggestions (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [grid, discovery, infeasible, broken, cutoff, report-only, substituted, unavailable]
    steps:
      - uses: actions/checkout@v7
      - name: Attempt to replace the workflow annotation
        if: matrix.scenario == 'substituted'
        run: echo '{}' > examples/release-remediation/required-export.json
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          manifest: >-
            ${{ (matrix.scenario == 'discovery' || matrix.scenario == 'cutoff') &&
            'examples/release-remediation/ceiling-only.json' || matrix.scenario == 'broken' &&
            'examples/release-remediation/breaking.json' ||
            'examples/release-remediation/proposed.json' }}
          baseline: examples/release-remediation/released.json
          depth: '4'
          required-workflows: >-
            ${{ matrix.scenario == 'unavailable' && 'missing-workflow.json' ||
            'examples/release-remediation/required-export.json' }}
          required-workflows-ref: HEAD
          repair-suggestions: 'true'
          repair-keep-tools: |
            select_rows
            export_rows
          repair-ceiling-grids: >-
            ${{ (matrix.scenario == 'grid' || matrix.scenario == 'report-only' ||
            matrix.scenario == 'substituted' || matrix.scenario == 'unavailable') &&
            'export_rows=0:2:1' || '' }}
          repair-discover-ceilings: >-
            ${{ (matrix.scenario == 'discovery' || matrix.scenario == 'cutoff' ||
            matrix.scenario == 'infeasible') && 'export_rows=1' || '' }}
          repair-max-evaluations: ${{ matrix.scenario == 'cutoff' && '1' || '128' }}
          fail-on: ${{ matrix.scenario == 'report-only' && 'never' || 'findings' }}
      - name: Verify advisory repairs and the unchanged gate
        env:
          SCENARIO: ${{ matrix.scenario }}
          OUTCOME: ${{ steps.gate.outcome }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          FINDINGS: ${{ steps.gate.outputs.findings }}
          REPORT: ${{ steps.gate.outputs.report }}
          REPAIRS: ${{ steps.gate.outputs.repair-report }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          scenario = os.environ['SCENARIO']
          assert os.environ['OUTCOME'] == ('success' if scenario == 'report-only' else 'failure')
          assert os.environ['VERDICT'] == 'findings'
          report = json.loads(Path(os.environ['REPORT']).read_text())
          repair = json.loads(Path(os.environ['REPAIRS']).read_text())
          assert repair == report['repairs']
          assert int(os.environ['FINDINGS']) == sum(
              c.get('blocking_findings', c['findings']) for c in report['checks'])
          assert all(c['name'] != 'repairs' for c in report['checks'])
          if scenario == 'unavailable':
              assert repair['status'] == 'skipped' and 'result' not in repair
          else:
              assert repair['status'] == 'completed'
              result = repair['result']
              diff = next(c for c in report['checks'] if c['name'] == 'diff')
              assert result['release']['comparison'] == diff['result']
              expected = 1 if scenario in {'grid', 'discovery', 'report-only', 'substituted'} else 0
              assert len(result['candidates']) == expected
              assert all(c['release']['gate_passed'] for c in result['candidates'])
              assert all(not c['authority']['breaches'] for c in result['candidates'])
              assert result['search']['truncated_by_limit'] == (scenario == 'cutoff')
              if scenario in {'discovery', 'infeasible', 'cutoff'}:
                  assert result['discovery']['frontier_complete_within_domain'] == (scenario != 'cutoff')
              commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              path = 'examples/release-remediation/required-export.json'
              content = subprocess.check_output(['git', 'show', f'{commit}:{path}'])
              assert repair['workflow_selection']['source_sha256'] == hashlib.sha256(content).hexdigest()
              assert repair['workflow_selection']['commit'] == commit
              if scenario == 'substituted':
                  assert Path(path).read_bytes() != content
          PY

  workflows:
    name: Required workflows (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [preserved, regressed, substituted, report-only]
    steps:
      - uses: actions/checkout@v7
      - name: Attempt to weaken the candidate's annotation
        if: matrix.scenario == 'substituted'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("examples/release-workflows/required-export.json")
          raw = json.loads(path.read_text())
          raw["workflows"][0]["steps"][1]["value"] = "1"
          path.write_text(json.dumps(raw))
          PY
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          manifest: ${{ matrix.scenario == 'preserved' && 'examples/action-workflows/preserved.json' || 'examples/release-workflows/breaking.json' }}
          baseline: examples/release-workflows/released.json
          depth: '4'
          required-workflows: examples/release-workflows/required-export.json
          required-workflows-ref: HEAD
          fail-on: ${{ matrix.scenario == 'report-only' && 'never' || 'findings' }}
      - name: Verify the gate, source pin and SARIF
        env:
          SCENARIO: ${{ matrix.scenario }}
          OUTCOME: ${{ steps.gate.outcome }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          FINDINGS: ${{ steps.gate.outputs.findings }}
          REPORT: ${{ steps.gate.outputs.report }}
          SARIF: ${{ steps.gate.outputs.sarif-file }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          scenario = os.environ["SCENARIO"]
          regressed = scenario != "preserved"
          expected_outcome = "success" if scenario in {"preserved", "report-only"} else "failure"
          assert os.environ["OUTCOME"] == expected_outcome
          assert os.environ["VERDICT"] == ("findings" if regressed else "clean")
          assert int(os.environ["FINDINGS"]) == int(regressed)
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          diff = next(c for c in report["checks"] if c["name"] == "diff")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          path = "examples/release-workflows/required-export.json"
          pinned = subprocess.check_output(["git", "show", f"{commit}:{path}"])
          assert diff["workflow_selection"]["commit"] == commit
          assert diff["workflow_selection"]["source_sha256"] == hashlib.sha256(pinned).hexdigest()
          assert diff["workflow_regressions"] == int(regressed)
          if scenario == "substituted":
              assert Path(path).read_bytes() != pinned
          sarif = json.loads(Path(os.environ["SARIF"]).read_text())
          results = [r for run in sarif["runs"] for r in run["results"]]
          assert bool(results) == regressed
          if regressed:
              assert results[0]["ruleId"] == "workflow.regressed"
              assert results[0]["properties"]["failure"]["step"] == 2
          PY

  clean:
    name: A clean manifest passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./
        with:
          manifest: examples/dispute-resolver.yaml
      - name: The outputs say so
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          FINDINGS: ${{ steps.gate.outputs.findings }}
        run: |
          test "${VERDICT}" = "clean"
          test "${FINDINGS}" = "0"

  breach:
    name: A reachable breach fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gate
        continue-on-error: true
        uses: ./
        with:
          manifest: examples/dispute-resolver-v2.yaml
          baseline: examples/dispute-resolver.yaml
      - name: It failed, and said why
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          SARIF: ${{ steps.gate.outputs.sarif-file }}
        run: |
          test "${OUTCOME}" = "failure"
          test "${VERDICT}" = "findings"
          python -c "
          import json, os, sys
          log = json.load(open(os.environ['SARIF']))
          assert log['version'] == '2.1.0'
          assert log['runs'][0]['results'], 'SARIF carried no result'
          "

  report_only:
    name: fail-on never reports without blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./
        with:
          manifest: examples/dispute-resolver-v2.yaml
          fail-on: never
      - name: Findings were reported and the step still passed
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
        run: test "${VERDICT}" = "findings"
