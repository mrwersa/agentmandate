name: Release

# Two ways in, one way out.
#
# Merging a pull request that raises the version in agentmandate/__init__.py
# tags the commit and creates the GitHub Release from that version's changelog
# section, then publishes. Nothing is typed by hand at release time, which is
# what let 0.5.0 ship a wheel whose __version__ still said 0.4.0.
#
# A release created in the GitHub UI still publishes. Releases created by
# GITHUB_TOKEN do not trigger workflows, so the tagging job has to carry on
# into the build in the same run rather than hand off to a second one.
on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  tag:
    name: Tag and create the release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      due: ${{ steps.decide.outputs.due }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decide whether a release is due
        id: decide
        run: |
          VERSION="$(python scripts/release_notes.py --print-version)"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} is already tagged, so this push is not a release"
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the release notes from the changelog
        if: steps.decide.outputs.due == 'true'
        run: |
          TAG="${{ steps.decide.outputs.tag }}"
          python scripts/release_notes.py "${TAG#v}" > release-notes.md
      - name: Create the tag and the release
        if: steps.decide.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --title "AgentMandate ${TAG}" \
            --notes-file release-notes.md \
            --verify-tag

  build:
    name: Build distributions
    needs: tag
    # always() keeps this reachable when the tag job is skipped, which is the
    # case for a release published from the GitHub UI.
    if: >-
      always() &&
      (github.event_name == 'release' || needs.tag.outputs.due == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || needs.tag.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check the built version matches the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || needs.tag.outputs.tag }}
        run: |
          # The wheel is what users install, so the check that matters is on
          # the built artefact rather than on the source it came from.
          test -f "dist/agentmandate-${RELEASE_TAG#v}-py3-none-any.whl"
          test -f "dist/agentmandate-${RELEASE_TAG#v}.tar.gz"
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentmandate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
