name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Enforce statement coverage
        run: >-
          python -m pytest -q
          --cov=agentmandate
          --cov-report=term-missing
          --cov-fail-under=100

  no-dependency-install:
    name: Core has no runtime dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install without extras
        run: python -m pip install .
      # A JSON manifest must work with nothing else installed. The YAML reader
      # is an extra, and the error when it is missing has to name the fix.
      - name: Analyse a JSON manifest with no extras present
        run: |
          cd "${RUNNER_TEMP}"
          cat > m.json <<'JSON'
          {"agent": "a", "limits": {"total": {"amount": 10, "currency": "GBP"}},
           "tools": [{"name": "seed", "effect": "read", "produces": "case",
                      "unbounded": true},
                     {"name": "pay", "effect": "irreversible", "requires": ["case"],
                      "value_arg": "amount", "scope_key": "case",
                      "requires_approval": true,
                      "ceiling": {"amount": 10, "currency": "GBP"}}]}
          JSON
          mandate reach m.json && exit 1
          echo "reach correctly exited non-zero on a reachable breach"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install --force-reinstall "dist/$(ls dist | grep '\.whl$')[yaml]"
      - name: Smoke-test installed package
        run: |
          # Three numbers have to agree: the literal in the source, what the
          # installed distribution reports, and what the imported package
          # reports. The old check compared the first two only, which is how
          # 0.5.0 shipped a wheel whose __version__ still said 0.4.0.
          export PACKAGE_VERSION
          PACKAGE_VERSION="$(python scripts/release_notes.py --print-version)"
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          import importlib.metadata as metadata
          import os

          import agentmandate

          expected = os.environ["PACKAGE_VERSION"]
          assert metadata.version("agentmandate") == expected, "distribution metadata"
          assert agentmandate.__version__ == expected, "agentmandate.__version__"
          PY
          mandate --help

  cedar-export:
    name: Native Cedar export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/cedar-export/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - name: Install the pinned native Cedar engine
        working-directory: examples/cedar-export
        run: npm ci --ignore-scripts
      - name: Validate policies and independent request decisions
        env:
          AGENTMANDATE_REQUIRE_CEDAR_NATIVE: "1"
        run: python -m pytest tests/test_cedar_export.py -q
      - name: Check the committed generated bundle
        working-directory: examples/cedar-export
        run: npm run check

  rego-export:
    name: Native Rego export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install the checksum-pinned native OPA engine
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          target = json.loads(pathlib.Path("examples/rego-export/opa-target.json").read_text())
          content = urllib.request.urlopen(target["url"], timeout=60).read()
          assert hashlib.sha256(content).hexdigest() == target["sha256"]
          executable = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opa"
          executable.write_bytes(content)
          executable.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"AGENTMANDATE_OPA={executable}\n")
          PYTHON
      - name: Validate policy and independent request decisions
        env:
          AGENTMANDATE_REQUIRE_OPA_NATIVE: "1"
        run: python -m pytest tests/test_rego_export.py tests/test_deployment_drift.py -q
      - name: Check the committed generated bundle
        run: python examples/rego-export/check.py --opa "$AGENTMANDATE_OPA"

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - coverage
      - no-dependency-install
      - package
      - cedar-export
      - rego-export
    # Runs even when a needed job fails, so the gate reports a real failure
    # instead of being skipped and leaving the required check pending forever.
    if: always()
    steps:
      - name: Require every upstream job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          NODEPS_RESULT: ${{ needs.no-dependency-install.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          CEDAR_RESULT: ${{ needs.cedar-export.result }}
          REGO_RESULT: ${{ needs.rego-export.result }}
        run: |
          echo "test:     ${TEST_RESULT}"
          echo "lint:     ${LINT_RESULT}"
          echo "coverage: ${COVERAGE_RESULT}"
          echo "no-deps:  ${NODEPS_RESULT}"
          echo "package:  ${PACKAGE_RESULT}"
          echo "cedar:    ${CEDAR_RESULT}"
          echo "rego:     ${REGO_RESULT}"
          for result in \
            "${TEST_RESULT}" \
            "${LINT_RESULT}" \
            "${COVERAGE_RESULT}" \
            "${NODEPS_RESULT}" \
            "${PACKAGE_RESULT}" \
            "${CEDAR_RESULT}" \
            "${REGO_RESULT}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
