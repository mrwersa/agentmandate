name: AgentMandate
description: >-
  Find the limits an AI agent can slip past by combining permitted actions, and
  fail a pull request that widens what it may do.
author: Saeed Aghaee

branding:
  icon: shield
  color: green

# Composite rather than Docker or JavaScript. There is nothing to compile, a
# container image would be a second thing to build and trust, and a composite
# step is readable: anyone can see exactly which commands run against their
# manifest.
inputs:
  manifest:
    description: Path to the mandate manifest (YAML or JSON).
    required: true
  source:
    description: >-
      Path to the agent's source. When set, `drift` runs and fails when the
      manifest has stopped describing the implementation.
    required: false
    default: ""
  baseline:
    description: >-
      The manifest as it stood at the last release. When set, `diff` runs and
      reports whether this change widened reachable authority. Add both
      required-workflow inputs to check path preservation as well.
    required: false
    default: ""
  required-workflows:
    description: >-
      Relative regular-file path to required-workflows/v2 in required-workflows-ref.
      Requires baseline. Never read from the candidate working tree.
    required: false
    default: ""
  required-workflows-ref:
    description: >-
      Locally available baseline or protected Git ref containing the workflow annotation.
      Pinned to one commit; the caller protects and authenticates its selection.
    required: false
    default: ""
  traces:
    description: >-
      An OTLP JSON export. When set, `verify` replays it against the manifest.
    required: false
    default: ""
  review-ref:
    description: >-
      Caller-selected protected Git ref containing review materials. Resolve it
      locally before invoking the action. Its protection/authentication is the
      caller's responsibility; the action pins one commit, not reviewer identity.
    required: false
    default: ""
  review-decision:
    description: Relative regular-file path to the decision in review-ref, never the working tree.
    required: false
    default: ""
  review-sources:
    description: Newline-separated LOCATOR=GIT_PATH mappings in that same pinned review commit.
    required: false
    default: ""
  review-as-of:
    description: Explicit YYYY-MM-DD UTC date supplied by the trusted workflow, not the decision.
    required: false
    default: ""
  map:
    description: >-
      Newline-separated `field=attribute` pairs for `verify`, for example
      `scope=app.case.id`. Required when `traces` is set, because nothing in
      the GenAI conventions carries the fields a control needs.
    required: false
    default: ""
  depth:
    description: Search depth for reachability.
    required: false
    default: "8"
  repair-suggestions:
    description: >-
      Opt in to advisory release repairs. Requires baseline. Snapshots both manifests;
      never applies candidates or changes the existing checks, counts or gate verdict.
    required: false
    default: "false"
  repair-keep-tools:
    description: Newline-separated reachable tool names every repair must retain.
    required: false
    default: ""
  repair-ceiling-grids:
    description: Newline-separated TOOL=MIN:MAX:STEP grids; exclusive with discovery.
    required: false
    default: ""
  repair-discover-ceilings:
    description: Newline-separated TOOL=STEP discovery domains, retaining all tools.
    required: false
    default: ""
  repair-max-edits:
    description: Maximum edits per repair (1-8).
    required: false
    default: "2"
  repair-max-evaluations:
    description: Maximum repair combinations or discovery probes (1-1024).
    required: false
    default: "128"
  repair-max-candidates:
    description: Maximum displayed repair candidates (1-20).
    required: false
    default: "5"
  repair-timeout-seconds:
    description: Repair subprocess time limit (1-300 seconds); a timeout retains no proposals.
    required: false
    default: "60"
  sarif:
    description: >-
      Write SARIF for code scanning. The file path is returned as an output;
      uploading it is the caller's step, so this action needs no extra token.
    required: false
    default: "true"
  summary:
    description: >-
      Write a job summary, including the authority graph. GitHub renders
      Mermaid there, so the counterexample is a picture rather than a log.
    required: false
    default: "true"
  fail-on:
    description: >-
      `findings` fails the step on any finding. `never` reports analysis
      findings without failing the step. Output-delivery I/O errors still fail.
    required: false
    default: "findings"
  python-version:
    description: Python to run the analysis on.
    required: false
    default: "3.12"

outputs:
  verdict:
    description: '`clean` or `findings`.'
    value: ${{ steps.gate.outputs.verdict }}
  findings:
    description: >-
      Blocking findings across every check that ran. Agrees with `verdict`:
      zero here means `clean`.
    value: ${{ steps.gate.outputs.findings }}
  notes:
    description: >-
      Advisory findings that do not fail the gate, such as lint warnings.
      Reported separately so a clean verdict never means nothing was found.
    value: ${{ steps.gate.outputs.notes }}
  sarif-file:
    description: Path to the SARIF file; empty when disabled or the file cannot be written.
    value: ${{ steps.gate.outputs.sarif-file }}
  report:
    description: Path to the combined JSON report; empty when the file cannot be written.
    value: ${{ steps.gate.outputs.report }}
  repair-report:
    description: >-
      Advisory repair JSON, including input identities and errors;
      empty when disabled or the file cannot be written.
    value: ${{ steps.gate.outputs.repair-report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AgentMandate
      shell: bash
      # From the action's own checkout, so the version that runs is the version
      # the caller pinned. Resolving a release from PyPI here would let the
      # analysis drift from the tag in their workflow file.
      run: python -I -m pip install --quiet "${{ github.action_path }}[yaml]"

    - name: Analyse
      id: gate
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_REQUIRED_WORKFLOWS: ${{ inputs.required-workflows }}
        INPUT_REQUIRED_WORKFLOWS_REF: ${{ inputs.required-workflows-ref }}
        INPUT_REVIEW_REF: ${{ inputs.review-ref }}
        INPUT_REVIEW_DECISION: ${{ inputs.review-decision }}
        INPUT_REVIEW_SOURCES: ${{ inputs.review-sources }}
        INPUT_REVIEW_AS_OF: ${{ inputs.review-as-of }}
        INPUT_TRACES: ${{ inputs.traces }}
        INPUT_MAP: ${{ inputs.map }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_REPAIR_SUGGESTIONS: ${{ inputs.repair-suggestions }}
        INPUT_REPAIR_KEEP_TOOLS: ${{ inputs.repair-keep-tools }}
        INPUT_REPAIR_CEILING_GRIDS: ${{ inputs.repair-ceiling-grids }}
        INPUT_REPAIR_DISCOVER_CEILINGS: ${{ inputs.repair-discover-ceilings }}
        INPUT_REPAIR_MAX_EDITS: ${{ inputs.repair-max-edits }}
        INPUT_REPAIR_MAX_EVALUATIONS: ${{ inputs.repair-max-evaluations }}
        INPUT_REPAIR_MAX_CANDIDATES: ${{ inputs.repair-max-candidates }}
        INPUT_REPAIR_TIMEOUT_SECONDS: ${{ inputs.repair-timeout-seconds }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: python -I "${{ github.action_path }}/scripts/action_gate.py"
